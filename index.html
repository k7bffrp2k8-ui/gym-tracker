<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0a0a0b"><meta name="apple-mobile-web-app-title" content="Тренировки">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14171a;--mu:#6b7280;--ac:#3b82f6;--bd:#e5e7eb;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--tx:#eceff3;--mu:#98a0ab;--bd:#2a2f37;--ac:#60a5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--tx:#eceff3;--mu:#98a0ab;--bd:#2a2f37;--ac:#60a5fa;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
main{max-width:620px;margin:0 auto;padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mu);font-size:15px;font-weight:600}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 4px;font-size:17px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button.b{padding:11px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
button.g{background:none;color:var(--ac);border:1px solid var(--bd)}
button.x{background:none;border:0;color:var(--bad);font-size:20px}
.full{width:100%;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:7px 11px;border-radius:20px;border:1px solid var(--bd);background:none;color:var(--tx);font-size:13px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--bg);border-radius:10px;padding:10px}.st b{display:block;font-size:20px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.ex{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.ex span{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
svg text{fill:var(--mu);font-size:10px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.mb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:360px}.mb p{margin:0 0 10px}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0a0a0b;--card:#151517;--tx:#fff;--mu:#8a8a90;--ac:#fff;--bd:#2a2a2e;color-scheme:dark}
.card{border:0;border-radius:24px;padding:16px}.b,input,select{border-radius:14px}
button.b:not(.g){color:#000}.chips button.on{color:#000}
nav{background:rgba(21,21,23,.92);backdrop-filter:blur(12px);border:0}nav button{font-size:13px}nav button.on{color:#fff}
h2{font-size:28px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal i{font-style:normal}.wd{color:var(--mu);font-size:12px;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:50%;border:1.5px solid transparent;background:none;color:var(--tx);font-size:16px;font-weight:600;padding:0}.day.d{border-color:var(--tx)}.day.s:not(.t){background:var(--bd)}.day.t{background:#fff;color:#000}
:root{--hl:#e8552f}.gb{height:6px;border-radius:3px;background:var(--bd);margin-top:3px}.gb i{display:block;height:100%;border-radius:3px;background:var(--hl)}
.mb{max-height:88vh;overflow:auto}
</style></head><body>
<main id="app"></main>
<nav><button data-t="c">Календарь</button><button data-t="w">Тренировка</button><button data-t="s">Статистика</button><button data-t="e">Упражнения</button></nav>
<script>
const KEY='gymlog_v1';
const DEF=['Вертикальная тяга (Тренажёр)','Горизонтальная тяга блока V-образной рукоятью','Бабочка (Тренажёр)','Махи в стороны (Гантели)','Обратная разводка одной рукой (Блок)','Сгибание рук на бицепс (Гантель)','Сгибание рук «молот» (Гантели)','Разгибание одной руки на трицепс (Блок)','Разгибание рук на трицепс с прямой рукоятью (Блок)'];
let S,tab='c',selEx=null,metric='maxW';
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return{ex:DEF.map((n,i)=>({id:'e'+i,name:n})),workouts:[],draft:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const GR=['Грудь','Спина','Плечи','Бицепс','Трицепс','Ноги','Ягодицы','Пресс'];
const DBS={'Грудь':'Жим штанги лёжа|Жим гантелей лёжа|Жим штанги на наклонной скамье|Жим гантелей на наклонной скамье|Жим штанги на скамье с отрицательным наклоном|Жим в тренажёре на грудь|Бабочка (Тренажёр)|Сведение рук в кроссовере (Блок)|Разводка гантелей лёжа|Разводка гантелей на наклонной скамье|Отжимания|Отжимания с широкой постановкой рук','Спина':'Вертикальная тяга (Тренажёр)|Горизонтальная тяга блока V-образной рукоятью|Подтягивания|Подтягивания обратным хватом|Тяга штанги в наклоне|Тяга гантели одной рукой|Тяга Т-грифа|Тяга верхнего блока к груди|Тяга верхнего блока узким хватом|Рычажная тяга (Тренажёр)|Гиперэкстензия|Становая тяга|Пуловер на блоке|Шраги с гантелями|Шраги со штангой','Плечи':'Жим штанги стоя|Жим гантелей сидя|Жим Арнольда|Жим в тренажёре на плечи|Махи в стороны (Гантели)|Махи в стороны (Блок)|Махи гантелей перед собой|Обратная разводка одной рукой (Блок)|Обратная разводка в тренажёре|Обратная разводка гантелей в наклоне|Тяга штанги к подбородку|Лицевая тяга (Блок)','Бицепс':'Сгибание рук на бицепс (Гантель)|Сгибание рук «молот» (Гантели)|Подъём штанги на бицепс|Подъём гантелей на бицепс на наклонной скамье|Сгибание рук на скамье Скотта|Концентрированное сгибание рук|Сгибание рук на бицепс (Блок)|Сгибание рук в тренажёре|Сгибание рук обратным хватом','Трицепс':'Разгибание одной руки на трицепс (Блок)|Разгибание рук на трицепс с прямой рукоятью (Блок)|Разгибание рук с канатной рукоятью (Блок)|Французский жим лёжа|Жим штанги узким хватом|Отжимания на брусьях|Разгибание руки с гантелью из-за головы|Обратные отжимания от скамьи','Ноги':'Приседания со штангой|Приседания в тренажёре Смита|Гакк-приседания|Жим ногами (Тренажёр)|Разгибание ног (Тренажёр)|Сгибание ног лёжа (Тренажёр)|Выпады с гантелями|Болгарские сплит-приседания|Румынская тяга|Подъём на носки стоя|Подъём на носки сидя','Ягодицы':'Ягодичный мостик|Ягодичный мостик со штангой|Отведение ноги назад (Блок)|Отведение ноги в сторону (Блок)|Разведение ног сидя (Тренажёр)','Пресс':'Скручивания|Скручивания на блоке|Боковые скручивания|Подъём ног в висе|Подъём ног лёжа|Планка|Велосипед|Складка|Колесо для пресса'};
const TECH={'Грудь':['Лягте, лопатки сведены, стопы на полу. Опускайте штангу к середине груди, локти под ~45° к корпусу, затем выжимайте вверх. Таз и лопатки не отрывайте.','Гантели над грудью, опускайте до растяжения груди, предплечья вертикально. Выжимайте по лёгкой дуге, сводя гантели вверху.','Скамья под 30°. Опускайте штангу к верху груди, локти не разводите широко. Выжимайте вверх без прогиба поясницы.','Скамья под 30°. Опускайте гантели до растяжения верха груди, выжимайте вверх, не отрывая лопатки от скамьи.','Скамья с небольшим наклоном головой вниз, нужна страховка. Опускайте штангу к нижней части груди, выжимайте вверх под контролем.','Подстройте сиденье: рукояти на уровне середины груди. Выжимайте вперёд, не отрывая спину от спинки, возвращайте медленно.','Спина прижата, рукояти на уровне груди, локти слегка согнуты. Сводите руки перед собой, на секунду задержитесь и медленно разводите.','Шаг вперёд, корпус чуть наклонён. Сводите руки перед грудью по дуге, локти слегка согнуты, на пике сожмите грудь.','Лёжа, гантели над грудью, локти слегка согнуты. Разводите в стороны до растяжения груди и возвращайте по той же дуге.','Скамья под 30°. Разводите гантели по дуге до растяжения верха груди, локти слегка согнуты, вернитесь без удара гантелей.','Упор лёжа, тело прямое. Опускайтесь, пока грудь почти не коснётся пола, локти под ~45°, выжимайтесь, не прогибая поясницу.','Руки шире плеч, тело прямое. Опускайтесь до груди у пола и поднимайтесь, не проваливая таз. Нагрузка больше на грудь.'],'Спина':['Сядьте, зафиксируйте бёдра. Тяните рукояти к верху груди, сводя лопатки, локти вниз. Не раскачивайтесь, возвращайте медленно.','Сидя, спина ровная, стопы упёрты. Тяните рукоять к животу, сводя лопатки, на пике задержка. Не заваливайте корпус назад.','Хват чуть шире плеч. Подтянитесь до подбородка над перекладиной, ведя локти вниз. Опускайтесь полностью, без раскачки.','Хват снизу на ширине плеч. Подтягивайтесь, ведя локти к корпусу: нагрузка на спину и бицепс. Опускайтесь до выпрямленных рук.','Наклон корпуса почти до параллели, спина ровная, колени согнуты. Тяните штангу к низу живота, локти назад, лопатки сведены.','Упор рукой и коленом в скамью, спина ровная. Тяните гантель к поясу, локоть вдоль корпуса, без вращения корпуса.','Наклон вперёд, спина ровная. Тяните рукоять к груди, сводя лопатки, не помогая рывком корпуса.','Хват шире плеч, лёгкий наклон назад. Тяните гриф к верху груди, лопатки вниз и вместе. Не тяните за голову.','Узкая рукоять, корпус чуть назад. Тяните к груди, локти прижаты, чувствуйте работу широчайших, возврат медленный.','Грудь на опоре, спина ровная. Тяните рукояти к корпусу, сводя лопатки, на пике задержитесь. Плечи не поднимайте.','Бёдра на опоре, корпус вниз с ровной спиной. Поднимайтесь до прямой линии с ногами, без переразгибания поясницы.','Штанга у голеней, спина ровная, лопатки сведены. Вставайте, толкая пол ногами, штанга близко к телу. Не округляйте поясницу.','Стоя у блока, руки почти прямые. Тяните рукоять дугой к бёдрам, чувствуя широчайшие, возвращайте медленно.','Гантели по бокам, спина ровная. Поднимайте плечи вверх к ушам, на пике задержка, без вращения плеч и без рывка.','Штанга в опущенных руках. Поднимайте плечи вверх, на пике сожмите трапеции, опускайте медленно. Руки не сгибайте.'],'Плечи':['Хват чуть шире плеч, штанга на верху груди. Выжимайте вверх над головой, голову слегка подайте вперёд. Поясницу не прогибайте.','Сидя, спина прижата. Выжимайте гантели вверх до выпрямления рук, опускайте до уровня ушей, локти не уводите далеко назад.','Начните с гантелей перед грудью ладонями к себе, выжимая, разворачивайте ладони вперёд. Опускайте с обратным разворотом.','Сиденье по росту, рукояти на уровне плеч. Выжимайте вверх без рывка, не отрывайте спину от спинки.','Гантели по бокам, локти слегка согнуты. Поднимайте в стороны до уровня плеч, мизинец чуть выше большого, без раскачки.','Стоя боком к блоку. Поднимайте руку в сторону до уровня плеч, локоть чуть согнут, опускайте медленно.','Гантели перед бёдрами. Поднимайте перед собой до уровня плеч, не раскачивая корпус, опускайте под контролем.','Стойка боком к блоку, рукоять в дальней руке. Разводите руку назад-в сторону на уровне плеч, нагружая заднюю дельту.','Грудью к спинке тренажёра, рукояти на уровне плеч. Разводите руки назад, локти чуть согнуты, лопатки не сводите резко.','Наклон корпуса почти параллельно полу, спина ровная. Разводите гантели в стороны до линии плеч, локти слегка согнуты.','Узкий хват, штанга вдоль тела. Тяните до груди, локти выше кистей, плечи не поднимайте к ушам.','Канат на уровне лица. Тяните к лицу, разводя руки в стороны, локти высоко, на пике сведите лопатки.'],'Бицепс':['Стоя, гантели по бокам, локти прижаты. Сгибайте руку, слегка супинируя кисть, на пике сожмите бицепс, опускайте медленно.','Ладони смотрят друг на друга. Сгибайте руки без вращения кисти, локти прижаты: нагружается и плечевая мышца.','Хват на ширине плеч, локти у корпуса. Поднимайте штангу без раскачки корпуса, опускайте полностью под контролем.','Скамья под 45°, руки свободно висят. Сгибайте руки, не выводя локти вперёд, получая растяжение бицепса.','Плечи на наклонной подушке, руки не отрываются. Сгибайте до сокращения, опускайте почти до полного разгибания.','Сидя, локоть упирается во внутреннюю часть бедра. Сгибайте руку с гантелью к плечу, на пике сожмите, опускайте медленно.','Стоя лицом к блоку, локти прижаты. Сгибайте руки к плечам, корпус не раскачивайте.','Подгоните сиденье, локти на подушке. Сгибайте рукояти к плечам, возвращайте не до полного расслабления.','Хват сверху, локти прижаты. Сгибайте руки, нагружая плечелучевую мышцу и предплечья, без раскачки.'],'Трицепс':['Стоя у блока, локоть прижат к корпусу. Разгибайте руку вниз до выпрямления, на пике сожмите трицепс, возвращайте медленно.','Прямая рукоять, локти прижаты к бокам. Разгибайте руки вниз до конца, плечи неподвижны, возврат медленный.','Канатная рукоять, локти у корпуса. Разгибайте вниз, в конце разведите концы каната в стороны для сокращения.','Лёжа, штанга над головой. Сгибайте только локти, опуская гриф ко лбу, затем разгибайте вверх. Локти не разводите.','Хват чуть уже плеч, локти у корпуса. Опускайте штангу к низу груди и выжимайте вверх, нагружая трицепс.','Упор на брусьях, корпус вертикально, локти назад. Опускайтесь до угла 90° в локтях и выжимайтесь вверх.','Гантель двумя руками над головой, локти направлены вверх. Опускайте за голову и разгибайте руки, локти не разводите.','Упор руками сзади на скамье, ноги вперёд. Опускайтесь, сгибая локти до 90°, и выжимайтесь, держа спину близко к скамье.'],'Ноги':['Штанга на трапециях, стопы на ширине плеч. Приседайте с ровной спиной до параллели бёдер и пола, колени по линии носков, вставайте.','Стопы слегка вперёд от грифа. Приседайте до параллели, спина прижата, поднимайтесь без отрыва пяток.','Плечи под подушками, стопы на платформе. Приседайте глубоко, спину прижимая к спинке, поднимайтесь без блокировки коленей.','Стопы на ширине плеч, поясница прижата. Опускайте платформу до угла ~90° в коленях, выжимайте, колени не блокируйте.','Сядьте, зафиксируйте бёдра. Разгибайте ноги до выпрямления, пауза вверху, медленно опускайте.','Лёжа, валик над пятками. Сгибайте ноги к ягодицам, таз не отрывайте, опускайте медленно.','Шагните вперёд, опуститесь до угла 90° в обоих коленях, колено не выходит за носок. Оттолкнитесь передней ногой назад.','Задняя нога на скамье. Приседайте на передней ноге, корпус чуть наклонён, колено по линии носка, вставайте.','Лёгкий сгиб в коленях, штанга у ног. Отводите таз назад с ровной спиной до растяжения задней поверхности бедра и вернитесь.','Стоя на возвышении носками, пятки свисают. Поднимайтесь на носки максимально, на пике задержка, опускайтесь до растяжения.','Сидя, колени под подушкой. Поднимайте пятки максимально, пауза вверху, опускайтесь медленно до растяжения.'],'Ягодицы':['Лёжа, лопатки на скамье или полу, стопы на ширине плеч. Поднимайте таз до прямой линии, сожмите ягодицы, опускайте медленно.','Лопатки на скамье, штанга на тазу. Поднимайте таз до линии корпуса и бёдер, ягодицы сжаты, поясницу не прогибайте.','Манжета на щиколотке. Отводите прямую ногу назад, ягодицу сжимайте на пике, корпус не раскачивайте.','Стоя боком к блоку, отводите ногу в сторону, корпус неподвижен. Возвращайте под контролем.','Сидя, спина прижата. Разводите бёдра в стороны, на пике пауза, возвращайте медленно.'],'Пресс':['Лёжа, ноги согнуты. Скручивайте корпус, отрывая лопатки, поясницу прижимайте. Шею не тяните руками.','На коленях у блока, канат у головы. Скручивайте корпус вниз, округляя спину, без движения бёдер.','Скручивайте корпус в сторону к противоположному колену, контролируйте, без рывков.','Вис на перекладине. Поднимайте ноги до уровня таза или выше, слегка подкручивая таз, не раскачивайтесь.','Лёжа на спине, поясница прижата. Поднимайте прямые ноги до вертикали, опускайте, не касаясь пола.','Упор на предплечьях, тело прямое. Держите, напрягая пресс и ягодицы, таз не прогибайте и не поднимайте.','Лёжа, поочерёдно сводите локоть и противоположное колено, поясница прижата, без рывков.','Лёжа, одновременно поднимайте корпус и ноги, касаясь руками стоп, слегка согнув колени.','На коленях катите колесо вперёд с напряжённым прессом до линии корпуса, возвращайтесь, не прогибая поясницу.']};

const PER=[['w','Неделя',7],['m','Месяц',30],['q','3 мес.',90],['h','6 мес.',180],['y','Год',365],['a','Всё',0]];
const inT=t=>{const p=PER.find(q=>q[0]===per);return !p[2]||t>=Date.now()-p[2]*864e5};
function buckets(){const D=864e5,now=new Date(),sd=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),p=PER.find(q=>q[0]===per),B=[];
 if(per==='w'){for(let i=6;i>=0;i--){const a=sd-i*D;B.push({a,b:a+D,l:fd(a)})}}
 else if(per==='m'||per==='q'){const n=Math.ceil(p[2]/7);for(let i=n-1;i>=0;i--){const b=sd+D-i*7*D,a=b-7*D;B.push({a,b,l:fd(a)})}}
 else{const f=new Date(Math.min(...S.workouts.map(w=>w.date),Date.now())),n=per==='h'?6:per==='y'?12:Math.min(36,(now.getFullYear()-f.getFullYear())*12+now.getMonth()-f.getMonth()+1);for(let i=n-1;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1).getTime(),b=new Date(now.getFullYear(),now.getMonth()-i+1,1).getTime();B.push({a,b,l:new Date(a).toLocaleDateString('ru',{month:'short'})})}}
 return B}
