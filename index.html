<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Тренировки">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0a0a0b">
<style>:root{--bg:#f2f2f5;--card:#fff;--tx:#0f0f12;--mu:#7a7a85;--ac:#0f0f12;--on:#fff;--bd:#e6e6ec;--hl:#e8552f;--ok:#16a34a;--bad:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0a0a0b;--card:#151517;--tx:#fff;--mu:#8a8a90;--ac:#fff;--on:#000;--bd:#26262b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0a0b;--card:#151517;--tx:#fff;--mu:#8a8a90;--ac:#fff;--on:#000;--bd:#26262b;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(104px + env(safe-area-inset-bottom,0px))}
main{max-width:620px;margin:0 auto;padding:14px}
main.in{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{margin:6px 0 14px;font-size:30px;font-weight:800;letter-spacing:-.5px}
h3{margin:0 0 4px;font-size:17px}
p{margin:6px 0}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font-size:16px;outline:none}
button{font:inherit;cursor:pointer}
.b{padding:13px 16px;border-radius:16px;border:0;background:var(--ac);color:var(--on);font-weight:700;font-size:15px}
.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
a.b{display:block;text-align:center;text-decoration:none;margin-top:10px}
.full{width:100%;margin-top:10px;display:block}
.x{background:none;border:0;color:var(--bad);font-size:20px;padding:4px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:8px 13px;border-radius:20px;border:0;background:var(--card);color:var(--tx);font-size:13px;font-weight:600}
.card .chips button{background:var(--bg)}
.chips button.on,.card .chips button.on{background:var(--ac);color:var(--on)}
.row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-top:8px}
.row2{display:flex;align-items:center;gap:8px;justify-content:space-between}
.btns{display:flex;gap:8px;margin-top:12px}.btns .b{flex:1;padding:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--bg);border-radius:16px;padding:12px}.st b{display:block;font-size:20px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.ex{display:flex;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.ex>span{flex:1}.ex select{width:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
svg text{fill:var(--mu);font-size:10px}
.gb{height:6px;border-radius:3px;background:var(--bd);margin-top:3px}.gb i{display:block;height:100%;border-radius:3px;background:var(--hl)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:596px;margin:0 auto;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:26px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:20px}
nav button.on{color:var(--tx);background:var(--bg)}
.ic{width:22px;height:22px;flex:none}
.hero{background:linear-gradient(135deg,#ff7a45,#e8552f 55%,#b8341a);color:#fff;border-radius:28px;padding:20px;margin-bottom:14px}
.hero .b{background:#fff;color:#111;margin-top:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:0;border-radius:22px;padding:16px;text-align:left;color:var(--tx);display:flex;flex-direction:column;gap:10px;font-weight:700;font-size:16px}
.tile .ic{color:var(--hl)}
.top{margin-bottom:2px}.back{background:none;border:0;color:var(--hl);font-size:16px;font-weight:600;padding:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal i{font-style:normal}
.wd{color:var(--mu);font-size:12px;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:50%;border:1.5px solid transparent;background:none;color:var(--tx);font-size:16px;font-weight:600;padding:0}
.day.d{border-color:var(--tx)}.day.s:not(.t){background:var(--bd)}.day.t{background:var(--tx);color:var(--bg)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mb{background:var(--card);border-radius:24px;padding:18px;width:100%;max-width:380px;max-height:88vh;overflow:auto}
.mb p{margin:0 0 10px}
.mb .chips button{background:var(--bg)}.mb .chips button.on{background:var(--ac);color:var(--on)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:0;border-radius:16px;padding:14px;margin-top:8px;color:var(--tx);font-size:16px}
.opt .mu{display:block;font-weight:400}
</style></head><body><main id="app"></main><nav></nav><script>
const KEY='gymlog_v1';
const DEF=['Вертикальная тяга (Тренажёр)','Горизонтальная тяга блока V-образной рукоятью','Бабочка (Тренажёр)','Махи в стороны (Гантели)','Обратная разводка одной рукой (Блок)','Сгибание рук на бицепс (Гантель)','Сгибание рук «молот» (Гантели)','Разгибание одной руки на трицепс (Блок)','Разгибание рук на трицепс с прямой рукоятью (Блок)'];
const GR=['Грудь','Спина','Плечи','Бицепс','Трицепс','Ноги','Ягодицы','Пресс'];
const DBS={'Грудь':'Жим штанги лёжа|Жим гантелей лёжа|Жим штанги на наклонной скамье|Жим гантелей на наклонной скамье|Жим штанги на скамье с отрицательным наклоном|Жим в тренажёре на грудь|Бабочка (Тренажёр)|Сведение рук в кроссовере (Блок)|Разводка гантелей лёжа|Разводка гантелей на наклонной скамье|Отжимания|Отжимания с широкой постановкой рук','Спина':'Вертикальная тяга (Тренажёр)|Горизонтальная тяга блока V-образной рукоятью|Подтягивания|Подтягивания обратным хватом|Тяга штанги в наклоне|Тяга гантели одной рукой|Тяга Т-грифа|Тяга верхнего блока к груди|Тяга верхнего блока узким хватом|Рычажная тяга (Тренажёр)|Гиперэкстензия|Становая тяга|Пуловер на блоке|Шраги с гантелями|Шраги со штангой','Плечи':'Жим штанги стоя|Жим гантелей сидя|Жим Арнольда|Жим в тренажёре на плечи|Махи в стороны (Гантели)|Махи в стороны (Блок)|Махи гантелей перед собой|Обратная разводка одной рукой (Блок)|Обратная разводка в тренажёре|Обратная разводка гантелей в наклоне|Тяга штанги к подбородку|Лицевая тяга (Блок)','Бицепс':'Сгибание рук на бицепс (Гантель)|Сгибание рук «молот» (Гантели)|Подъём штанги на бицепс|Подъём гантелей на бицепс на наклонной скамье|Сгибание рук на скамье Скотта|Концентрированное сгибание рук|Сгибание рук на бицепс (Блок)|Сгибание рук в тренажёре|Сгибание рук обратным хватом','Трицепс':'Разгибание одной руки на трицепс (Блок)|Разгибание рук на трицепс с прямой рукоятью (Блок)|Разгибание рук с канатной рукоятью (Блок)|Французский жим лёжа|Жим штанги узким хватом|Отжимания на брусьях|Разгибание руки с гантелью из-за головы|Обратные отжимания от скамьи','Ноги':'Приседания со штангой|Приседания в тренажёре Смита|Гакк-приседания|Жим ногами (Тренажёр)|Разгибание ног (Тренажёр)|Сгибание ног лёжа (Тренажёр)|Выпады с гантелями|Болгарские сплит-приседания|Румынская тяга|Подъём на носки стоя|Подъём на носки сидя','Ягодицы':'Ягодичный мостик|Ягодичный мостик со штангой|Отведение ноги назад (Блок)|Отведение ноги в сторону (Блок)|Разведение ног сидя (Тренажёр)','Пресс':'Скручивания|Скручивания на блоке|Боковые скручивания|Подъём ног в висе|Подъём ног лёжа|Планка|Велосипед|Складка|Колесо для пресса'};
const TECH={'Грудь':['Лягте, лопатки сведены, стопы на полу. Опускайте штангу к середине груди, локти под ~45° к корпусу, затем выжимайте вверх. Таз и лопатки не отрывайте.','Гантели над грудью, опускайте до растяжения груди, предплечья вертикально. Выжимайте по лёгкой дуге, сводя гантели вверху.','Скамья под 30°. Опускайте штангу к верху груди, локти не разводите широко. Выжимайте вверх без прогиба поясницы.','Скамья под 30°. Опускайте гантели до растяжения верха груди, выжимайте вверх, не отрывая лопатки от скамьи.','Скамья с небольшим наклоном головой вниз, нужна страховка. Опускайте штангу к нижней части груди, выжимайте вверх под контролем.','Подстройте сиденье: рукояти на уровне середины груди. Выжимайте вперёд, не отрывая спину от спинки, возвращайте медленно.','Спина прижата, рукояти на уровне груди, локти слегка согнуты. Сводите руки перед собой, на секунду задержитесь и медленно разводите.','Шаг вперёд, корпус чуть наклонён. Сводите руки перед грудью по дуге, локти слегка согнуты, на пике сожмите грудь.','Лёжа, гантели над грудью, локти слегка согнуты. Разводите в стороны до растяжения груди и возвращайте по той же дуге.','Скамья под 30°. Разводите гантели по дуге до растяжения верха груди, локти слегка согнуты, вернитесь без удара гантелей.','Упор лёжа, тело прямое. Опускайтесь, пока грудь почти не коснётся пола, локти под ~45°, выжимайтесь, не прогибая поясницу.','Руки шире плеч, тело прямое. Опускайтесь до груди у пола и поднимайтесь, не проваливая таз. Нагрузка больше на грудь.'],'Спина':['Сядьте, зафиксируйте бёдра. Тяните рукояти к верху груди, сводя лопатки, локти вниз. Не раскачивайтесь, возвращайте медленно.','Сидя, спина ровная, стопы упёрты. Тяните рукоять к животу, сводя лопатки, на пике задержка. Не заваливайте корпус назад.','Хват чуть шире плеч. Подтянитесь до подбородка над перекладиной, ведя локти вниз. Опускайтесь полностью, без раскачки.','Хват снизу на ширине плеч. Подтягивайтесь, ведя локти к корпусу: нагрузка на спину и бицепс. Опускайтесь до выпрямленных рук.','Наклон корпуса почти до параллели, спина ровная, колени согнуты. Тяните штангу к низу живота, локти назад, лопатки сведены.','Упор рукой и коленом в скамью, спина ровная. Тяните гантель к поясу, локоть вдоль корпуса, без вращения корпуса.','Наклон вперёд, спина ровная. Тяните рукоять к груди, сводя лопатки, не помогая рывком корпуса.','Хват шире плеч, лёгкий наклон назад. Тяните гриф к верху груди, лопатки вниз и вместе. Не тяните за голову.','Узкая рукоять, корпус чуть назад. Тяните к груди, локти прижаты, чувствуйте работу широчайших, возврат медленный.','Грудь на опоре, спина ровная. Тяните рукояти к корпусу, сводя лопатки, на пике задержитесь. Плечи не поднимайте.','Бёдра на опоре, корпус вниз с ровной спиной. Поднимайтесь до прямой линии с ногами, без переразгибания поясницы.','Штанга у голеней, спина ровная, лопатки сведены. Вставайте, толкая пол ногами, штанга близко к телу. Не округляйте поясницу.','Стоя у блока, руки почти прямые. Тяните рукоять дугой к бёдрам, чувствуя широчайшие, возвращайте медленно.','Гантели по бокам, спина ровная. Поднимайте плечи вверх к ушам, на пике задержка, без вращения плеч и без рывка.','Штанга в опущенных руках. Поднимайте плечи вверх, на пике сожмите трапеции, опускайте медленно. Руки не сгибайте.'],'Плечи':['Хват чуть шире плеч, штанга на верху груди. Выжимайте вверх над головой, голову слегка подайте вперёд. Поясницу не прогибайте.','Сидя, спина прижата. Выжимайте гантели вверх до выпрямления рук, опускайте до уровня ушей, локти не уводите далеко назад.','Начните с гантелей перед грудью ладонями к себе, выжимая, разворачивайте ладони вперёд. Опускайте с обратным разворотом.','Сиденье по росту, рукояти на уровне плеч. Выжимайте вверх без рывка, не отрывайте спину от спинки.','Гантели по бокам, локти слегка согнуты. Поднимайте в стороны до уровня плеч, мизинец чуть выше большого, без раскачки.','Стоя боком к блоку. Поднимайте руку в сторону до уровня плеч, локоть чуть согнут, опускайте медленно.','Гантели перед бёдрами. Поднимайте перед собой до уровня плеч, не раскачивая корпус, опускайте под контролем.','Стойка боком к блоку, рукоять в дальней руке. Разводите руку назад-в сторону на уровне плеч, нагружая заднюю дельту.','Грудью к спинке тренажёра, рукояти на уровне плеч. Разводите руки назад, локти чуть согнуты, лопатки не сводите резко.','Наклон корпуса почти параллельно полу, спина ровная. Разводите гантели в стороны до линии плеч, локти слегка согнуты.','Узкий хват, штанга вдоль тела. Тяните до груди, локти выше кистей, плечи не поднимайте к ушам.','Канат на уровне лица. Тяните к лицу, разводя руки в стороны, локти высоко, на пике сведите лопатки.'],'Бицепс':['Стоя, гантели по бокам, локти прижаты. Сгибайте руку, слегка супинируя кисть, на пике сожмите бицепс, опускайте медленно.','Ладони смотрят друг на друга. Сгибайте руки без вращения кисти, локти прижаты: нагружается и плечевая мышца.','Хват на ширине плеч, локти у корпуса. Поднимайте штангу без раскачки корпуса, опускайте полностью под контролем.','Скамья под 45°, руки свободно висят. Сгибайте руки, не выводя локти вперёд, получая растяжение бицепса.','Плечи на наклонной подушке, руки не отрываются. Сгибайте до сокращения, опускайте почти до полного разгибания.','Сидя, локоть упирается во внутреннюю часть бедра. Сгибайте руку с гантелью к плечу, на пике сожмите, опускайте медленно.','Стоя лицом к блоку, локти прижаты. Сгибайте руки к плечам, корпус не раскачивайте.','Подгоните сиденье, локти на подушке. Сгибайте рукояти к плечам, возвращайте не до полного расслабления.','Хват сверху, локти прижаты. Сгибайте руки, нагружая плечелучевую мышцу и предплечья, без раскачки.'],'Трицепс':['Стоя у блока, локоть прижат к корпусу. Разгибайте руку вниз до выпрямления, на пике сожмите трицепс, возвращайте медленно.','Прямая рукоять, локти прижаты к бокам. Разгибайте руки вниз до конца, плечи неподвижны, возврат медленный.','Канатная рукоять, локти у корпуса. Разгибайте вниз, в конце разведите концы каната в стороны для сокращения.','Лёжа, штанга над головой. Сгибайте только локти, опуская гриф ко лбу, затем разгибайте вверх. Локти не разводите.','Хват чуть уже плеч, локти у корпуса. Опускайте штангу к низу груди и выжимайте вверх, нагружая трицепс.','Упор на брусьях, корпус вертикально, локти назад. Опускайтесь до угла 90° в локтях и выжимайтесь вверх.','Гантель двумя руками над головой, локти направлены вверх. Опускайте за голову и разгибайте руки, локти не разводите.','Упор руками сзади на скамье, ноги вперёд. Опускайтесь, сгибая локти до 90°, и выжимайтесь, держа спину близко к скамье.'],'Ноги':['Штанга на трапециях, стопы на ширине плеч. Приседайте с ровной спиной до параллели бёдер и пола, колени по линии носков, вставайте.','Стопы слегка вперёд от грифа. Приседайте до параллели, спина прижата, поднимайтесь без отрыва пяток.','Плечи под подушками, стопы на платформе. Приседайте глубоко, спину прижимая к спинке, поднимайтесь без блокировки коленей.','Стопы на ширине плеч, поясница прижата. Опускайте платформу до угла ~90° в коленях, выжимайте, колени не блокируйте.','Сядьте, зафиксируйте бёдра. Разгибайте ноги до выпрямления, пауза вверху, медленно опускайте.','Лёжа, валик над пятками. Сгибайте ноги к ягодицам, таз не отрывайте, опускайте медленно.','Шагните вперёд, опуститесь до угла 90° в обоих коленях, колено не выходит за носок. Оттолкнитесь передней ногой назад.','Задняя нога на скамье. Приседайте на передней ноге, корпус чуть наклонён, колено по линии носка, вставайте.','Лёгкий сгиб в коленях, штанга у ног. Отводите таз назад с ровной спиной до растяжения задней поверхности бедра и вернитесь.','Стоя на возвышении носками, пятки свисают. Поднимайтесь на носки максимально, на пике задержка, опускайтесь до растяжения.','Сидя, колени под подушкой. Поднимайте пятки максимально, пауза вверху, опускайтесь медленно до растяжения.'],'Ягодицы':['Лёжа, лопатки на скамье или полу, стопы на ширине плеч. Поднимайте таз до прямой линии, сожмите ягодицы, опускайте медленно.','Лопатки на скамье, штанга на тазу. Поднимайте таз до линии корпуса и бёдер, ягодицы сжаты, поясницу не прогибайте.','Манжета на щиколотке. Отводите прямую ногу назад, ягодицу сжимайте на пике, корпус не раскачивайте.','Стоя боком к блоку, отводите ногу в сторону, корпус неподвижен. Возвращайте под контролем.','Сидя, спина прижата. Разводите бёдра в стороны, на пике пауза, возвращайте медленно.'],'Пресс':['Лёжа, ноги согнуты. Скручивайте корпус, отрывая лопатки, поясницу прижимайте. Шею не тяните руками.','На коленях у блока, канат у головы. Скручивайте корпус вниз, округляя спину, без движения бёдер.','Скручивайте корпус в сторону к противоположному колену, контролируйте, без рывков.','Вис на перекладине. Поднимайте ноги до уровня таза или выше, слегка подкручивая таз, не раскачивайтесь.','Лёжа на спине, поясница прижата. Поднимайте прямые ноги до вертикали, опускайте, не касаясь пола.','Упор на предплечьях, тело прямое. Держите, напрягая пресс и ягодицы, таз не прогибайте и не поднимайте.','Лёжа, поочерёдно сводите локоть и противоположное колено, поясница прижата, без рывков.','Лёжа, одновременно поднимайте корпус и ноги, касаясь руками стоп, слегка согнув колени.','На коленях катите колесо вперёд с напряжённым прессом до линии корпуса, возвращайтесь, не прогибая поясницу.']};

 +`<div class='card'><table><tr><th>Дата</th><th>Подходы (кг×повт)</th><th>Объём</th><th></th></tr>${hs.slice().reverse().map((x,i)=>`<tr><td>${new Date(x.d).toLocaleDateString('ru')}</td><td>${x.s.map(ss).join(', ')}</td><td>${fmt(M[M.length-1-i].vol)}</td><td><button class='x' style='font-size:16px' data-a='delrec' data-w='${x.id}' data-ex='${selEx}'>×</button></td></tr>`).join('')}</table></div>`;return h}
function vS(){const p=PER.find(q=>q[0]===per),cur=S.workouts.filter(w=>inT(w.date)),val=w=>act==='cnt'?1:wv(w),tot=cur.reduce((a,w)=>a+val(w),0);let dl='';
 if(p[2]){const now=Date.now(),pv=S.workouts.filter(w=>w.date<now-p[2]*DAY&&w.date>=now-2*p[2]*DAY).reduce((a,w)=>a+val(w),0),d=tot-pv;dl=`<span class='${d>0?'up':d<0?'dn':'mu'}'>${d>0?'↗ +':d<0?'↘ ':''}${Math.round(d).toLocaleString('ru')}</span>`}
 const B=buckets().map(b=>({l:b.l,v:S.workouts.filter(w=>w.date>=b.a&&w.date<b.b).reduce((a,w)=>a+val(w),0)})),mx=Math.max(1,...B.map(b=>b.v)),W=340,H=150,bw=(W-10)/B.length,st=Math.ceil(B.length/6);
 const bars=`<svg viewBox='0 0 ${W} ${H+22}' width='100%'>`+B.map((b,i)=>{const h=Math.max(b.v?4:1,b.v/mx*(H-10)),x=5+i*bw;return `<rect x='${x+bw*.15}' y='${H-h}' width='${bw*.7}' height='${h}' rx='3' fill='${b.v?'var(--hl)':'var(--bd)'}'/>`+(i%st===0?`<text x='${x+bw/2}' y='${H+14}' text-anchor='middle'>${b.l}</text>`:'')}).join('')+'</svg>';
 const m=gStats(),sum=GR.reduce((a,g)=>a+m[g],0),gmx=Math.max(1,...GR.map(g=>m[g])),weak=GR.reduce((a,g)=>m[g]<m[a]?g:a,GR[0]);
 const bw2=S.bw.slice().sort((a,b)=>a.d-b.d),bp=bw2.filter(x=>inT(x.d));let bh=`<div class='card'><h3>Вес тела</h3>`;
 if(bw2.length){const lv=bw2[bw2.length-1],d=bp.length>1?bp[bp.length-1].w-bp[0].w:0;bh+=`<div class='row2' style='align-items:baseline'><b style='font-size:26px'>${fmt(lv.w)} кг</b>${bp.length>1?`<span class='mu'>${d>0?'+':''}${fmt(d)} кг за период</span>`:''}</div>`+(bp.length?line('lcbw',bp.map(x=>x.w),bp.map(x=>x.d),'кг'):`<div class='mu'>В выбранном периоде записей нет</div>`)+bw2.slice(-4).reverse().map(x=>`<div class='ex'><span>${new Date(x.d).toLocaleDateString('ru')}</span><b>${fmt(x.w)} кг</b><button class='x' data-a='bwdel' data-id='${x.id}'>×</button></div>`).join('')}
 else bh+=`<div class='mu'>Записывай вес, чтобы видеть динамику массы тела.</div>`;
 bh+=`<div style='display:flex;gap:8px;margin-top:12px'><input id='bwv' inputmode='decimal' placeholder='Вес, кг'><input type='date' id='bwd' value='${iso(Date.now())}'></div><button class='b full' data-a='bwadd'>Записать вес</button></div>`;
 return `<h2>Статистика</h2><div class='chips'>${PER.map(q=>`<button class='${q[0]===per?'on':''}' data-a='per' data-p='${q[0]}'>${q[1]}</button>`).join('')}</div>`
 +`<div class='card'><div class='row2' style='align-items:baseline'><b style='font-size:26px'>${Math.round(tot).toLocaleString('ru')}${act==='vol'?' кг':''}</b>${dl}</div><div class='mu'>${act==='vol'?'Общий объём':'Тренировок'} за период</div>${bars}<div class='chips'><button class='${act==='vol'?'on':''}' data-a='act' data-k='vol'>Объём</button><button class='${act==='cnt'?'on':''}' data-a='act' data-k='cnt'>Тренировки</button></div></div>`
 +`<div class='card'><h3>Группы мышц</h3><div class='mu'>Нагрузка по числу подходов</div>${radar(m,gmx)}${sum?`<div class='mu'>Меньше всего нагрузки: <b style='color:var(--tx)'>${weak}</b></div>`:`<div class='mu'>Нет данных за период</div>`}`+GR.map(g=>`<div style='margin-top:10px'><div class='row2'><span>${g}</span><span class='mu'>${m[g]} подх.</span></div><div class='gb'><i style='width:${m[g]/gmx*100}%'></i></div></div>`).join('')+`</div>`+bh+`<h2 style='font-size:22px;margin-top:22px'>По упражнению</h2>`+vSx()}

let navDone=false;
function render(){const y=window.scrollY,h=app.offsetHeight;app.style.minHeight=h+'px';
 if(!navDone){$('nav').innerHTML=[['h','Главная'],['c','Календарь'],['t','Шаблоны'],['s','Статистика'],['e','Каталог']].map(([t,l])=>`<button data-t='${t}'>${ic(t)}<span>${l}</span></button>`).join('');navDone=true}
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===NAVMAP[tab]));
 app.innerHTML=({h:vH,c:vC,t:vT,te:vTe,s:vS,e:vE,w:vW,g:vG})[tab]();
 document.querySelectorAll('svg.lc').forEach(s=>setCh(s,CHS[s.id].v.length-1));
 if(tab!==lastTab){scrollTo(0,0);app.classList.remove('in');void app.offsetWidth;app.classList.add('in')}else scrollTo(0,y);
 lastTab=tab;app.style.minHeight=''}

document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){qText=t.value;$('#res').innerHTML=resList()}else if(t.id==='tn'){tplEd.name=t.value}else if(t.dataset.f&&S.draft){const q=S.draft.sets[t.dataset.ex][+t.dataset.i];(t.dataset.j!==undefined?q.x[+t.dataset.j]:q)[t.dataset.f]=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='selex'){selEx=t.value;render()}else if(t.id==='wd'&&S.draft&&t.value){S.draft.date=atTime(t.value,S.draft.date);save();render()}else if(t.classList.contains('gs')){const x=exOf(t.dataset.ex);if(x){x.g=t.value;save()}}else if(t.id==='imp'){const f=t.files[0];if(f)f.text().then(imp)}});
document.addEventListener('click',e=>{
 const n=e.target.closest('nav button');if(n){go(n.dataset.t);return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.ex,D=S.draft;
 if(a==='go')go(el.dataset.t);
 else if(a==='start'){if(D)return go('w');startFlow(tab==='c'&&calSel!==dk(Date.now())?atTime(calSel):Date.now())}
 else if(a==='opencal'){calSel=el.dataset.k;const p=calSel.split('-');cal=new Date(+p[0],+p[1]-1,1);go('c')}
 else if(a==='addset'){D.sets[id].push({w:'',r:'',x:[]});save();render()}
 else if(a==='delset'){const s=D.sets[id];s.splice(+el.dataset.i,1);if(!s.length)s.push({w:'',r:'',x:[]});save();render()}
 else if(a==='adddrop'){const q=D.sets[id][+el.dataset.i];(q.x=q.x||[]).push({w:'',r:''});save();render()}
 else if(a==='deldrop'){D.sets[id][+el.dataset.i].x.splice(+el.dataset.j,1);save();render()}
 else if(a==='rmex'){D.order=D.order.filter(x=>x!==id);delete D.sets[id];save();render()}
 else if(a==='addexw'){pickEx(x=>{if(!D.order.includes(x)){D.order.push(x);D.sets[x]=[{w:'',r:'',x:[]}]}save();render()})}
 else if(a==='finish'){const sets={},nm={},gr={};let any=false;D.order.forEach(k=>{const v=valid(D.sets[k]||[]);if(v.length){sets[k]=v;nm[k]=nmAny(k);gr[k]=grAny(k);any=true}});
  if(!any){dlg('Запиши хотя бы один подход (вес или повторы)',()=>{});return}
  const wk=D.editId&&S.workouts.find(q=>q.id===D.editId);
  if(wk){wk.sets=sets;wk.nm=nm;wk.gr=gr;wk.date=D.date}else S.workouts.push({id:'w'+Date.now(),date:D.date,sets,nm,gr,tpl:D.tpl||null});
  calSel=dk(D.date);cal=new Date(D.date);S.draft=null;save();go('c')}
 else if(a==='cancel'){dlg('Отменить текущую тренировку? Введённые данные не сохранятся.',()=>{S.draft=null;save();go('h')})}
 else if(a==='editw'){const w=S.workouts.find(q=>q.id===el.dataset.w);if(!w)return;const run=()=>{const sets={};for(const k in w.sets)sets[k]=w.sets[k].map(x=>({w:x.w,r:x.r,x:(x.x||[]).map(q=>({w:q.w,r:q.r}))}));S.draft={date:w.date,order:Object.keys(w.sets),sets,editId:w.id};save();go('w')};D?dlg('Текущая незавершённая тренировка будет заменена. Продолжить?',run):run()}
 else if(a==='delw'){dlg('Удалить эту тренировку целиком?',()=>{S.workouts=S.workouts.filter(w=>w.id!==el.dataset.w);save();render()})}
 else if(a==='delrec'){dlg('Удалить запись этого упражнения из тренировки?',()=>{const w=S.workouts.find(q=>q.id===el.dataset.w);if(w){delete w.sets[id];if(!Object.keys(w.sets).length)S.workouts=S.workouts.filter(q=>q!==w)}save();render()})}
 else if(a==='cprev'||a==='cnext'){cal=new Date(cal.getFullYear(),cal.getMonth()+(a==='cnext'?1:-1),1);render()}
 else if(a==='cday'){calSel=el.dataset.k;render()}
 else if(a==='per'){per=el.dataset.p;render()}
 else if(a==='act'){act=el.dataset.k;render()}
 else if(a==='met'){metric=el.dataset.m;render()}
 else if(a==='qg'){qg=el.dataset.g;render()}
 else if(a==='addcat'){addFromCat(+el.dataset.k);render()}
 else if(a==='info'){const it=DBL[+el.dataset.k];showInfo(it[0],it[1],it[2])}
 else if(a==='infoex'){const x=exOf(id),f=DBL.find(q=>q[0].toLowerCase()===x.name.toLowerCase());showInfo(x.name,gOf(x),f&&f[2])}
 else if(a==='addex'){const v=$('#newex').value.trim();if(v){S.ex.push({id:'e'+Date.now(),name:v,g:grp(v)});save();render()}}
 else if(a==='ren'){const x=exOf(id);dlg('Название упражнения',v=>{if(v&&v.trim()){x.name=v.trim();save();render()}},x.name)}
 else if(a==='delex'){dlg('Скрыть упражнение из списков? История и статистика сохранятся.',()=>{exOf(id).del=true;save();render()})}
 else if(a==='tplnew'){tplEd={id:null,name:'',ex:[]};go('te')}
 else if(a==='tpled'){const p=S.tpl.find(q=>q.id===el.dataset.id);tplEd={id:p.id,name:p.name,ex:p.ex.slice()};go('te')}
 else if(a==='tpldel'){dlg('Удалить шаблон? Прошлые тренировки не пострадают.',()=>{S.tpl=S.tpl.filter(q=>q.id!==el.dataset.id);save();render()})}
 else if(a==='tplstart'){const p=S.tpl.find(q=>q.id===el.dataset.id);D?dlg('Текущая незавершённая тренировка будет заменена. Продолжить?',()=>begin(Date.now(),p)):begin(Date.now(),p)}
 else if(a==='tadd'){pickEx(x=>{if(!tplEd.ex.includes(x))tplEd.ex.push(x);render()})}
 else if(a==='trm'){tplEd.ex.splice(+el.dataset.i,1);render()}
 else if(a==='tup'||a==='tdn'){const i=+el.dataset.i,j=a==='tup'?i-1:i+1,t=tplEd.ex;if(j>=0&&j<t.length){[t[i],t[j]]=[t[j],t[i]];render()}}
 else if(a==='tsave'){const nm=(tplEd.name||'').trim();if(!nm)return dlg('Введи название шаблона',()=>{});if(!tplEd.ex.length)return dlg('Добавь хотя бы одно упражнение',()=>{});
  if(tplEd.id){const p=S.tpl.find(q=>q.id===tplEd.id);p.name=nm;p.ex=tplEd.ex}else S.tpl.push({id:'t'+Date.now(),name:nm,ex:tplEd.ex});save();go('t')}
 else if(a==='theme'){S.set.theme=el.dataset.v;save();applyTheme();render()}
 else if(a==='bwadd'){const v=num($('#bwv').value),ds=$('#bwd').value;if(v<=0||!ds)return dlg('Введи вес тела в кг',()=>{});S.bw.push({id:'b'+Date.now(),d:atTime(ds),w:v});save();render()}
 else if(a==='bwdel'){S.bw=S.bw.filter(x=>x.id!==el.dataset.id);save();render()}
 else if(a==='exp'){const nm='trainings-'+iso(Date.now())+'.json',f=new File([JSON.stringify(S)],nm,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
  else{const u=URL.createObjectURL(f),l=document.createElement('a');l.href=u;l.download=nm;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}}
 else if(a==='cpy'){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>dlg('Данные скопированы. Вставь их в заметки или отправь себе.',()=>{}),()=>dlg('Не удалось скопировать. Используй «Сохранить в файл».',()=>{}))}
 else if(a==='pst'){dlg('Вставь скопированные данные',v=>imp(v),'')}
});
applyTheme();render();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
